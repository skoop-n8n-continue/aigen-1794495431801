<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="./manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOY MART - Coming Soon</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="decorations">
            <div class="balloon b1"></div>
            <div class="balloon b2"></div>
            <div class="balloon b3"></div>
            <div class="block">A</div>
            <div class="block b-2">B</div>
            <div class="block b-3">C</div>
        </div>

        <header>
            <h1 class="logo">TOY MART</h1>
            <p class="subtitle">Where Fun Begins!</p>
        </header>

        <main>
            <h2 class="coming-soon">COMING SOON</h2>
            <p class="message">Get ready for a world of imagination and play.<br>We are building the most amazing toy store just for you!</p>
        </main>

        <div class="train-container">
            <div class="train">
                <div class="engine">🚂</div>
                <div class="car">🧸</div>
                <div class="car">🚗</div>
                <div class="car">🎨</div>
                <div class="car">🧩</div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js')
          .then(function (reg) { console.log('[PWA] SW registered:', reg.scope); })
          .catch(function (err) { console.warn('[PWA] SW registration failed:', err); });
      });
    }
  </script>
</body>
</html>
